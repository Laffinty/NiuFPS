<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#122018" />
    <meta name="description" content="原创黄牛生存射击 Web 3D FPS：一头直立行走的黄牛，手持 AK-47，穿过狼群与毒蛇抵达集结点。" />
    <title>森林突围：黄牛 FPS</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="game-root" aria-hidden="true"></div>

    <section id="start-screen" class="screen">
      <div class="panel">
        <div class="brand">
          <span class="brand-mark">牛</span>
          <h1>森林突围：黄牛 FPS</h1>
        </div>
        <p class="tagline">原创黄牛生存射击 · 开局一把 AK-47，穿过狼群与毒蛇抵达集结点</p>

        <div class="field">
          <label for="difficulty">难度</label>
          <select id="difficulty">
            <option value="easy">简单</option>
            <option value="normal" selected>普通</option>
            <option value="hard">困难</option>
          </select>
          <div id="wolf-count" class="field-note">100 只狼</div>
        </div>

        <div class="field">
          <label for="perspective">默认视角</label>
          <select id="perspective">
            <option value="first" selected>第一人称</option>
            <option value="third">第三人称</option>
          </select>
        </div>

        <button id="start-button" class="primary-button">进入森林</button>

        <div class="controls-hint">
          <p><strong>PC</strong>：WASD 移动 · 鼠标瞄准 · 左键射击 · 1/2 切枪 · R 换弹 · V 视角 · Space 跳 · Ctrl 蹲</p>
          <p><strong>手机</strong>：左摇杆移动 · 右半屏拖动视角 · 右侧按钮开火/跳跃/蹲下/换弹</p>
        </div>
      </div>
    </section>

    <div id="hud" class="hidden">
      <div id="top-left" class="hud-panel">
        <div class="health-row">
          <span class="health-icon">♥</span>
          <div id="health-bar"><div id="health-fill"></div></div>
          <span id="health-text">100</span>
        </div>
        <div class="meta-row">
          <span id="weapon">AK-47</span>
          <span id="ammo">30 / 120</span>
        </div>
      </div>

      <div id="top-right" class="hud-panel minimap-panel">
        <canvas id="minimap" width="164" height="164"></canvas>
        <div class="minimap-label">战术地图</div>
      </div>

      <div id="bottom-left" class="hud-panel bottom-stats">
        <div>集结点 <span id="distance">0m</span></div>
        <div>怪物 <span id="enemies">0</span></div>
        <div>时间 <span id="timer">00:00</span></div>
      </div>

      <div id="crosshair">
        <span class="ch-line top"></span>
        <span class="ch-line bottom"></span>
        <span class="ch-line left"></span>
        <span class="ch-line right"></span>
      </div>

      <div id="damage-vignette"></div>
      <div id="game-message"></div>

      <button id="btn-pause" class="icon-button" aria-label="暂停">Ⅱ</button>

      <div id="touch-controls">
        <div id="move-joystick"><div id="move-knob"></div></div>
        <div id="look-area"></div>
        <div class="touch-actions">
          <button id="btn-fire" class="touch-button fire">开火</button>
          <button id="btn-jump" class="touch-button">跳跃</button>
          <button id="btn-crouch" class="touch-button">蹲下</button>
          <button id="btn-reload" class="touch-button">换弹</button>
          <button id="btn-weapon" class="touch-button">切枪</button>
          <button id="btn-view" class="touch-button">视角</button>
        </div>
      </div>
    </div>

    <div id="fullscreen-prompt" class="hidden">点击进入全屏，获得最佳手机体验</div>

    <section id="pause-screen" class="screen hidden">
      <div class="panel">
        <h2>暂停</h2>
        <p>黄牛停下脚步，狼群仍在森林里游荡。</p>
        <button id="resume-button" class="primary-button">继续游戏</button>
        <button id="pause-restart-button" class="secondary-button">重新开始</button>
      </div>
    </section>

    <section id="end-screen" class="screen hidden">
      <div class="panel">
        <h2 id="end-title">胜利</h2>
        <p id="end-stats"></p>
        <button id="restart-button" class="primary-button">再玩一局</button>
      </div>
    </section>

    <noscript>本游戏需要启用 JavaScript。</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
