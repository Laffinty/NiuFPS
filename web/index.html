<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#122018" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NiuFPS" />
    <meta name="description" content="牛FPS · NiuFPS：原创 Web 3D 生存射击。直立行走的牛，手持 AK-47，穿过狼群与毒蛇抵达集结点。" />
    <title>牛FPS · NiuFPS</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="game-root" aria-hidden="true"></div>

    <section id="start-screen" class="screen menu-screen">
      <div class="menu-glow" aria-hidden="true"></div>
      <div class="menu-scanlines" aria-hidden="true"></div>
      <div class="menu-layout">
        <div class="menu-hero">
          <canvas id="menu-hero" aria-label="牛主角立绘"></canvas>
          <div class="menu-hero-tag" aria-hidden="true">HERO SHOT · 牛主角</div>
        </div>
        <div class="panel menu-panel">
          <div class="brand">
            <span class="brand-mark">牛</span>
            <div class="brand-titles">
              <h1>牛FPS</h1>
              <p class="brand-en">NiuFPS</p>
            </div>
          </div>
          <p class="tagline">开局一把 AK-47，穿过狼群与毒蛇抵达集结点</p>

          <div class="difficulty-group" role="radiogroup" aria-label="难度">
            <button type="button" class="difficulty-button" data-difficulty="hard" aria-pressed="false">高</button>
            <button type="button" class="difficulty-button selected" data-difficulty="normal" aria-pressed="true">中</button>
            <button type="button" class="difficulty-button" data-difficulty="easy" aria-pressed="false">低</button>
          </div>
          <div id="wolf-count" class="field-note">中 · 100 只狼</div>

          <button id="start-button" class="primary-button">开始游戏</button>

          <div class="controls-hint">
            <p><strong>PC</strong>：WASD 移动 · 鼠标瞄准 · 左键射击 · 1/2 切枪 · R 换弹 · V 视角 · Space 跳 · Ctrl 蹲</p>
            <p><strong>手机</strong>：左摇杆移动 · 右半屏拖动视角 · 右侧按钮开火/跳跃/蹲下/换弹</p>
          </div>
        </div>
      </div>
    </section>

    <div id="hud" class="hidden">
      <div id="top-left" class="hud-panel">
        <div class="health-row">
          <span class="health-icon">♥</span>
          <div id="health-bar"><div id="health-fill"></div></div>
          <span id="health-text">100</span>
        </div>
        <div class="meta-row">
          <span id="weapon">AK-47</span>
          <span id="ammo">30 / 120</span>
        </div>
      </div>

      <div id="top-right" class="hud-panel minimap-panel">
        <canvas id="minimap" width="164" height="164"></canvas>
        <div class="minimap-label">战术地图</div>
      </div>

      <div id="bottom-left" class="hud-panel bottom-stats">
        <div>集结点 <span id="distance">0m</span></div>
        <div>怪物 <span id="enemies">0</span></div>
        <div>时间 <span id="timer">00:00</span></div>
      </div>

      <div id="crosshair">
        <span class="ch-line top"></span>
        <span class="ch-line bottom"></span>
        <span class="ch-line left"></span>
        <span class="ch-line right"></span>
      </div>

      <div id="damage-vignette"></div>
      <div id="game-message"></div>

      <button id="btn-pause" class="icon-button" aria-label="暂停">Ⅱ</button>

            <div id="touch-controls">
        <div id="move-zone">
          <div id="move-joystick" class="hidden"><div id="move-knob"></div></div>
        </div>
        <div id="look-area"></div>
        <div class="touch-pad touch-pad-left">
          <button id="btn-jump" class="touch-button" aria-label="跳跃"><span class="tb-icon" aria-hidden="true">↑</span></button>
          <button id="btn-crouch" class="touch-button" aria-label="蹲下"><span class="tb-icon" aria-hidden="true">↓</span></button>
        </div>
        <div class="touch-pad touch-pad-actions">
          <button id="btn-reload" class="touch-button" aria-label="换弹"><span class="tb-icon" aria-hidden="true">↻</span></button>
          <button id="btn-weapon" class="touch-button" aria-label="切枪"><span class="tb-icon" aria-hidden="true">⇄</span></button>
        </div>
        <div class="touch-pad touch-pad-fire">
          <button id="btn-fire" class="touch-button fire" aria-label="开火"><span class="tb-icon" aria-hidden="true">●</span></button>
        </div>
        <button id="btn-view" class="touch-button" aria-label="视角切换"><span class="tb-icon" aria-hidden="true">◉</span></button>
      </div>
    </div>

    <div id="fullscreen-gate" class="hidden">
      <div class="gate-panel">
        <div class="gate-icon" aria-hidden="true">⛶</div>
        <button id="fullscreen-btn" class="gate-button">⛶ 全屏</button>
        <p id="fullscreen-msg" class="gate-message">为获得最佳体验，请使用横屏全屏模式</p>
        <p id="fullscreen-sub" class="gate-sub"></p>
      </div>
    </div>

    <section id="pause-screen" class="screen hidden">
      <div class="panel">
        <h2>暂停</h2>
        <p>牛停下脚步，狼群仍在森林里游荡。</p>
        <button id="resume-button" class="primary-button">继续游戏</button>
        <button id="pause-restart-button" class="secondary-button">重新开始</button>
      </div>
    </section>

    <section id="end-screen" class="screen hidden">
      <div class="panel">
        <h2 id="end-title">胜利</h2>
        <p id="end-stats"></p>
        <button id="restart-button" class="primary-button">再玩一局</button>
      </div>
    </section>

    <noscript>本游戏需要启用 JavaScript。</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
